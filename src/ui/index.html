<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <!--
        CSP: 外部への読み込みはすべて禁止し、同梱ファイル（'self'）だけを許可する。
        style-src のハッシュ: pywebview（webview/js/customize.js）が text_select=False のときに
        差し込む <style>（body {-webkit-user-select: none; ...}）だけを許可するためのもの。
        pywebview を更新したら、この CSS が変わっていないか確認すること。
    -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'sha256-RoIvEyQwR8x7XAq0wvZTfMiswRYjOD0c8DenZVf2Kss='; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <link rel="stylesheet" href="style.css">
    <link id="theme-link" rel="stylesheet" href="themes/valorant.css">

    <title>PALETTE LAUNCH</title>

    <!-- ライブラリ（同梱。バージョンと取得元は vendor/README.md） -->
    <script src="vendor/Sortable.min.js"></script>

    <!-- フォント（同梱。ライセンスと取得元は fonts/README.md） -->
    <link href="fonts/fonts.css" rel="stylesheet">
</head>

<body>
    <div class="launcher-shell">
        <header>
            <h1>PALETTE LAUNCH</h1>
            <div class="header-controls">
                <!-- 言語切り替え -->
                <select id="lang-select" class="theme-select">
                    <option value="ja">日本語</option>
                    <option value="en">English</option>
                </select>

                <!-- テーマ切り替え -->
                <select id="theme-select" class="theme-select">
                    <!-- JSで動的に追加されます -->
                </select>

                <!-- カードサイズ切り替え -->
                <select id="card-size-select" class="theme-select">
                    <option value="small"></option>
                    <option value="medium"></option>
                </select>

                <!-- カテゴリ追加ボタン -->
                <button class="add-cat-btn">+ CATEGORY</button>
            </div>
        </header>

        <!-- 
            この app-container に JS で .size-small などのクラスが付与され、
            中のカードサイズが一括制御されます。
        -->
        <main id="app-container">
            <!-- JSで動的に描画されます -->
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
